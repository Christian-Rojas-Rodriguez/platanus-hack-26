[project]
name = "ph26"
version = "0.1.0"
description = "Platanus Hack 26 — track AI Security"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ph26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
