  <rect x="80" y="40" width="310" height="160" fill="#eef2c8"/>
  <text x="88" y="58" fill="#7a8a00" font-family="JetBrains Mono" font-size="11" font-weight="600">GOLDEN ZONE · fácil y mucho impacto</text>
  <rect x="514" y="40" width="186" height="400" fill="#f3e3e1" opacity=".7"/>
  <text x="607" y="430" text-anchor="middle" fill="#5d6152" font-family="JetBrains Mono" font-size="10.5">alto riesgo aun con 15 h</text>
  <line x1="80" y1="200" x2="700" y2="200" stroke="#5d6152" stroke-dasharray="5 4"/>
  <text x="696" y="214" text-anchor="end" fill="#5d6152" font-family="JetBrains Mono" font-size="10.5">umbral wow del jurado</text>
  <line x1="80" y1="440" x2="700" y2="440" stroke="#d6d9cb"/>
  <line x1="80" y1="40" x2="80" y2="440" stroke="#d6d9cb"/>
