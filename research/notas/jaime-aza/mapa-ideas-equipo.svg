    <text x="80" y="456">0</text><text x="204" y="456">2</text><text x="328" y="456">4</text><text x="452" y="456">6</text><text x="576" y="456">8</text><text x="700" y="456">10</text>
  </g>
  <g fill="#5d6152" font-family="JetBrains Mono" font-size="10.5" text-anchor="end">
