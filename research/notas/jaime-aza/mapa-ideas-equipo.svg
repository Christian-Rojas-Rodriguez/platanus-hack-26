    <circle cx="396" cy="224" r="11" fill="#1f8a7a"/><text x="396" y="228.5" text-anchor="middle" fill="#ffffff">7</text>
    <text x="412" y="228" fill="#17190f">ScopeProof</text>
    <circle cx="415" cy="256" r="11" fill="#1f8a7a"/><text x="415" y="260.5" text-anchor="middle" fill="#ffffff">8</text>
