<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" style="background:#ffffff;font-family:sans-serif" viewBox="0 0 760 500" role="img" aria-label="Gráfico de dificultad contra impacto de 12 ideas del equipo">
